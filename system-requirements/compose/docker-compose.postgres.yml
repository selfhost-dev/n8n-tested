# Override: run n8n on Postgres 16 (the image the n8n-with-postgresql template uses).
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
services:
  n8n:
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8nbench-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=test-only-password
      - DB_POSTGRESDB_SCHEMA=public
    depends_on:
      n8nbench-db:
        condition: service_healthy

  n8nbench-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=test-only-password
      - POSTGRES_DB=n8n
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg-data:
